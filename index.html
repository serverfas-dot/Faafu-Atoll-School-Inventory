  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- GitHub Pages SPA routing: decode path from 404.html redirect -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname + decoded + l.hash
          );
        }
      })();
    </script>
  </body>
