<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Faafu Atoll School Inventory System</title>
    <script>
      // GitHub Pages SPA redirect — encodes the path as a query string
      // so index.html can decode it and the React app boots on the right route.
      // pathSegmentsToKeep = 1 because this is a project page (repo name counts as 1 segment).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
