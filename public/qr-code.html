<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Stock Inventory System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            color: #1a202c;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .qr-container {
            background: #f7fafc;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin: 32px 0;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 256px;
        }

        #qrcode img {
            max-width: 100%;
            height: auto;
        }

        .instructions {
            background: #edf2f7;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-top: 24px;
        }

        .instructions h3 {
            color: #2d3748;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .instructions ol {
            color: #4a5568;
            font-size: 14px;
            line-height: 1.8;
            padding-left: 20px;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        .url-display {
            background: white;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-family: monospace;
            font-size: 12px;
            color: #2d3748;
            word-break: break-all;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        @media print {
            body {
                background: white;
            }

            .button-group {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/png.png" alt="School Logo" style="border-radius: 50%;">
        </div>

        <h1>Stock Inventory System</h1>
        <p class="subtitle">Faafu Atoll School</p>

        <div class="qr-container">
            <div id="qrcode">
                <p style="color: #718096;">Loading QR Code...</p>
            </div>
        </div>

        <div class="instructions">
            <h3>📱 Scan QR code to access:</h3>
            <ol>
                <li>Open Camera app on your phone</li>
                <li>Point camera at the QR code above</li>
                <li>Tap the notification to open the form</li>
                <li>Submit your stationery requests</li>
            </ol>
            <div class="url-display" id="urlDisplay">Loading URL...</div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="window.print()">🖨️ Print QR Code</button>
            <button class="btn-secondary" onclick="downloadQR()">💾 Download</button>
        </div>
    </div>

    <script>
        const currentUrl = window.location.origin;
        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(currentUrl)}`;

        document.getElementById('qrcode').innerHTML = `<img src="${qrApiUrl}" alt="QR Code">`;
        document.getElementById('urlDisplay').textContent = currentUrl;

        function downloadQR() {
            const link = document.createElement('a');
            link.href = qrApiUrl;
            link.download = 'stock-inventory-qr-code.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
